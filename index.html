<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#153c58">
  <meta name="description" content="Registra tus gastos en pesos colombianos y expórtalos a Excel.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>Mis gastos</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#193247;background:#f1f5f8;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}main{max-width:560px;margin:auto;padding:24px 16px calc(28px + env(safe-area-inset-bottom))}
    header{padding:22px;background:#153c58;color:white;border-radius:18px}h1{font-size:26px;margin:0 0 5px}header p{margin:0;color:#d7e6ef}
    section{margin-top:16px;background:white;border-radius:18px;padding:18px;box-shadow:0 4px 18px #153c5814}
    label{display:block;font-weight:650;margin:8px 0}input{width:100%;font:inherit;font-size:17px;padding:14px;border:1px solid #bbc9d3;border-radius:10px}
    button{width:100%;margin-top:13px;padding:14px;border:0;border-radius:11px;background:#087e70;color:white;font:700 16px system-ui;cursor:pointer}
    button.secondary{background:#153c58}button:disabled{opacity:.55}#status{min-height:22px;margin:12px 0 0;color:#176b4c;font-size:14px}
    .hint{font-size:13px;color:#667985;margin:7px 0}.row{padding:12px 0;border-bottom:1px solid #e5ebef}.amount{font-weight:700}.desc{font-size:14px;color:#607481;overflow-wrap:anywhere}
    .empty{color:#667985;font-size:14px;margin:14px 0 2px}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}.count{font-size:13px;color:#607481}
  </style>
</head>
<body><main>
  <header><h1>Mis gastos</h1><p>Tu registro personal en pesos colombianos</p></header>
  <section>
    <form id="form"><label for="note">¿Qué gastaste?</label><input id="note" required autocomplete="off" placeholder="Ej.: Gasté 10.000 en un shampoo"><p class="hint">Escribe un valor y una descripción. Ejemplo: 10.000, $10.000 o 10000.</p><button>Agregar gasto</button></form>
    <p id="status" role="status" aria-live="polite"></p>
  </section>
  <section><div class="topline"><strong>Gastos guardados</strong><span class="count" id="count"></span></div><div id="rows"></div><button id="export" class="secondary" type="button">Descargar Excel (.xlsx)</button><p class="hint">Los datos quedan guardados en este teléfono. Descarga el Excel para guardarlo en Archivos/Descargas o compartirlo.</p></section>
</main>
<script>
const KEY='gastos-cop-v1', form=document.querySelector('#form'), input=document.querySelector('#note'), statusEl=document.querySelector('#status');
let expenses=[];
try{expenses=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(expenses))expenses=[]}catch{expenses=[]}
function persist(){localStorage.setItem(KEY,JSON.stringify(expenses))}
function render(){const box=document.querySelector('#rows');document.querySelector('#count').textContent=`${expenses.length} registro(s)`;box.replaceChildren();if(!expenses.length){const e=document.createElement('p');e.className='empty';e.textContent='Aún no hay gastos.';box.append(e);return}expenses.slice().reverse().slice(0,20).forEach(x=>{const row=document.createElement('div');row.className='row';const amount=document.createElement('div');amount.className='amount';amount.textContent=`#${x.id} · ${money(x.valor)}`;const desc=document.createElement('div');desc.className='desc';desc.textContent=`${x.descripcion} · ${x.fecha}`;row.append(amount,desc);box.append(row)})}
function money(n){return new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n)}
function parse(text){const m=text.match(/(?<!\w)\$?\s*(\d[\d.,]*)/);if(!m)throw Error('Escribe un valor, por ejemplo: Gasté 10.000 en un shampoo.');const raw=m[1], digits=raw.replace(/[.,]/g,'');if(!/^\d+$/.test(digits)||Number(digits)<1)throw Error('El valor debe ser un número mayor que cero.');const description=(text.slice(0,m.index)+' '+text.slice(m.index+m[0].length)).replace(/\s+/g,' ').trim().replace(/^[-,:;.\s]+|[-,:;.\s]+$/g,'');if(!description)throw Error('Agrega una descripción además del valor.');return{valor:Number(digits),descripcion:description}}
form.addEventListener('submit',e=>{e.preventDefault();try{const item=parse(input.value);item.id=expenses.reduce((a,x)=>Math.max(a,Number(x.id)||0),0)+1;item.fecha=new Date().toLocaleDateString('sv-SE');expenses.push(item);persist();render();statusEl.textContent=`Gasto #${item.id} guardado en este teléfono.`;input.value='';input.focus()}catch(err){statusEl.textContent=err.message}});

// Crea un XLSX real localmente (ZIP + XML), sin enviar datos a ningún servicio.
const encoder=new TextEncoder();
function crc32(bytes){let c=~0;for(const b of bytes){c^=b;for(let k=0;k<8;k++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(~c)>>>0}
function u16(n){return[n&255,(n>>>8)&255]}function u32(n){return[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255]}
function zip(files){let locals=[],central=[],offset=0;for(const [name,content] of files){const nb=encoder.encode(name),data=encoder.encode(content),crc=crc32(data);const local=new Uint8Array([...u32(0x04034b50),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...nb,...data]);locals.push(local);const cd=new Uint8Array([...u32(0x02014b50),...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(33),...u32(crc),...u32(data.length),...u32(data.length),...u16(nb.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(offset),...nb]);central.push(cd);offset+=local.length}const csize=central.reduce((a,x)=>a+x.length,0),end=new Uint8Array([...u32(0x06054b50),...u16(0),...u16(0),...u16(files.length),...u16(files.length),...u32(csize),...u32(offset),...u16(0)]);return new Blob([...locals,...central,end],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xmlEscape(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&apos;')}
function col(n){let s='';while(n){let r=(n-1)%26;s=String.fromCharCode(65+r)+s;n=Math.floor((n-1)/26)}return s}
document.querySelector('#export').addEventListener('click',()=>{if(!expenses.length){statusEl.textContent='Agrega al menos un gasto antes de descargar el Excel.';return}const all=[['ID','Valor (COP)','Descripción','Fecha'],...expenses.map(x=>[x.id,x.valor,x.descripcion,x.fecha])];const sheet='<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetFormatPr defaultRowHeight="18"/><cols><col min="1" max="1" width="10" customWidth="1"/><col min="2" max="2" width="18" customWidth="1"/><col min="3" max="3" width="48" customWidth="1"/><col min="4" max="4" width="16" customWidth="1"/></cols><sheetData>'+all.map((row,ri)=>'<row r="'+(ri+1)+'">'+row.map((v,ci)=>{const ref=col(ci+1)+(ri+1);if(ri===0)return'<c r="'+ref+'" t="inlineStr" s="1"><is><t>'+xmlEscape(v)+'</t></is></c>';if(ci<2)return'<c r="'+ref+'"><v>'+Number(v)+'</v></c>';return'<c r="'+ref+'" t="inlineStr"><is><t>'+xmlEscape(v)+'</t></is></c>'}).join('')+'</row>').join('')+'</sheetData><autoFilter ref="A1:D'+all.length+'"/></worksheet>';
const files=[['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>'],['_rels/.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'],['xl/workbook.xml','<?xml version="1.0" encoding="UTF-8"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Gastos" sheetId="1" r:id="rId1"/></sheets></workbook>'],['xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>'],['xl/styles.xml','<?xml version="1.0" encoding="UTF-8"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF1F4E78"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>'],['xl/worksheets/sheet1.xml','<?xml version="1.0" encoding="UTF-8"?>'+sheet]];
const blob=zip(files),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`gastos_${new Date().toISOString().slice(0,10)}.xlsx`;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);statusEl.textContent='Excel descargado. Búscalo en Archivos o Descargas del teléfono.'});
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
render();
</script></body></html>
